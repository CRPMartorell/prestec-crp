name: Desplega a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instal·la dependències
        run: npm ci

      - name: Comprova tipus
        run: npm run lint

      - name: Proves unitàries
        run: npm test

      - name: Build (només catàleg públic)
        run: npm run build:public
        env:
          VITE_BASE: /prestec-crp/

      - name: Comprova que el bundle públic no inclou el panell
        run: npm run check:bundle

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
